<style>
.vteke-breadcrumb {
    background: #ffffff;
    border-bottom: 1px solid #ebebeb;
    padding: 12px 0;
    font-size: 0.82rem;
    color: #888;
}
.vteke-breadcrumb-inner {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    align-items: center;
    gap: 8px;
}
.vteke-breadcrumb a {
    color: #555;
    text-decoration: none;
    font-weight: 500;
    transition: color 0.2s;
}
.vteke-breadcrumb a:hover { color: #E10600; }
.vteke-breadcrumb-sep { color: #ccc; }
.vteke-breadcrumb-current { color: #E10600; font-weight: 600; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vteke-typography.css">
</head>

</div>

<!-- Language Switcher - Desktop -->
<div class="lang-dropdown-wrapper" id="langDropdown">
<button class="lang-dropdown-btn" onclick="toggleLanguageDropdown()" aria-label="Switch Language" aria-expanded="false">
<span class="language-flag" id="currentLangFlag">🇬🇧</span>
<span class="language-text" id="currentLangText">EN</span>
<i class="bi bi-chevron-down"></i>
</button>
<div class="lang-dropdown-menu" role="menu">
<button class="lang-dropdown-item" onclick="setLanguage('en')" role="menuitem">
<span class="language-flag">🇬🇧</span> English
</button>
<button class="lang-dropdown-item" onclick="setLanguage('tr')" role="menuitem">
<span class="language-flag">🇹🇷</span> Türkçe
</button>
</div>
</div>
</div>
</div>

</div>

<div class="vteke-pro-mobile-language-container">
<button class="vteke-pro-mobile-language-btn active" id="mobileLangEN" onclick="setLanguage('en')" aria-label="Switch to English">
<span class="language-flag">🇬🇧</span>
<span class="language-text">English</span>
</button>
<button class="vteke-pro-mobile-language-btn" id="mobileLangTR" onclick="setLanguage('tr')" aria-label="Türkçe'ye geç">
<span class="language-flag">🇹🇷</span>
<span class="language-text">Türkçe</span>
</button>
</div>

<p class="vteke-pro-copyright-text">© 2026 VTEKE Professional Electric. All Rights Reserved.</p>
